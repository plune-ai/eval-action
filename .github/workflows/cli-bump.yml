name: CLI version bump

# Opens the pull request that moves the pinned @plune-ai/cli to a new release. plune-ai/cli's
# publish.yml dispatches it once the npm tarball of a `latest` release answers 200; it can also be
# run by hand from the Actions tab with the version.
#
# The pull request is opened with COURIER_PR_TOKEN, not GITHUB_TOKEN: a pull request opened with
# GITHUB_TOKEN starts its pull_request runs in an approval-required state, so the smoke test would
# wait for a click instead of proving the new pin.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
#
# The pin stays a pin on purpose: a consumer's CI must not change under them because the CLI
# shipped. This only saves typing the pull request; merging it and tagging the action stay manual.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "@plune-ai/cli version published with the latest tag, e.g. 0.39.4"
        required: true

permissions:
  contents: read

concurrency:
  group: cli-bump
  cancel-in-progress: false

jobs:
  pr:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.COURIER_PR_TOKEN }}
    steps:
      - name: Check the token, the version and the npm tarball
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No COURIER_PR_TOKEN secret: add a fine-grained token with Contents and Pull requests write on this repository."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"
            exit 1
          fi
          if ! curl -fsSI -o /dev/null "https://registry.npmjs.org/@plune-ai/cli/-/cli-$VERSION.tgz"; then
            echo "::error::npm does not serve @plune-ai/cli $VERSION yet: the smoke test would fail on it."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.COURIER_PR_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node scripts/bump-cli.mjs "$VERSION"

      - name: Open the pull request
        run: |
          BRANCH="chore/cli-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "chore: pin @plune-ai/cli $VERSION"
          git push -q --force origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = OPEN ]; then
            echo "Pull request for $BRANCH is already open; branch refreshed."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore: pin @plune-ai/cli $VERSION" \
            --body "Moves the pinned \`@plune-ai/cli\` to $VERSION in \`action.yml\`, \`mcp/action.yml\` and the README. Opened by the CLI version bump workflow after the release reached npm. Merging and the \`vX.Y.Z\` / \`v1\` tags stay manual."
