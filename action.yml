name: 'Plune eval diff'
description: 'Run Plune evals on a pull request and comment the regression diff against the base branch.'
author: 'plune-ai'
branding:
  icon: 'check-circle'
  color: 'purple'

# Thin wrapper over the @plune-ai/cli binary (ADR-GA01): no eval/diff logic lives here — the steps
# only orchestrate `plune run` + `plune diff` and post the result. Inputs/outputs are a public
# contract: changing them is a breaking change (bump the major tag).
inputs:
  config:
    description: 'Path to plune.yaml (relative to working-directory).'
    required: false
    default: 'plune.yaml'
  working-directory:
    description: 'Directory to run Plune in.'
    required: false
    default: '.'
  base-ref:
    description: 'Baseline git ref to compare the PR against.'
    required: false
    default: 'main'
  use-mock:
    description: 'Run with the built-in mock provider (no API key, zero cost). Set to "false" to call a real provider (requires a key via env/secrets).'
    required: false
    default: 'true'
  fail-on-regression:
    description: 'Fail the check when a pass→fail regression is detected, or when an eval could not be measured (its run errored). Off by default — the diff is always commented.'
    required: false
    default: 'false'
  max-pass-rate-drop-percent:
    description: 'Gate: fail the check when the overall pass rate drops by more than this many percentage points. Off when empty. Needs a plune-version with the diff gates.'
    required: false
    default: ''
  max-cost-usd:
    description: 'Gate: fail the check when the PR run costs more than this many USD. Off when empty. Needs a plune-version with the diff gates.'
    required: false
    default: ''
  max-cost-increase-percent:
    description: 'Gate: fail the check when the PR run costs more than this many percent over the baseline. Off when empty. Needs a plune-version with the diff gates.'
    required: false
    default: ''
  max-tokens:
    description: 'Gate: fail the check when the PR run uses more than this many tokens (input plus output). Off when empty. Needs a plune-version with the diff gates.'
    required: false
    default: ''
  waivers:
    description: 'Path to a waivers YAML file for measured gate failures (relative to working-directory). Off when empty. Needs a plune-version with the diff gates.'
    required: false
    default: ''
  comment:
    description: 'Post (and update in place) a sticky PR comment with the diff.'
    required: false
    default: 'true'
  plune-version:
    # Pinned to a published @plune-ai/cli version; bump in lockstep with this action's release.
    description: 'Version of @plune-ai/cli to install from npm. Pinned for reproducibility; tracks this action release. Consumers should also pin the action ref (e.g. @v1).'
    required: false
    default: '0.36.0'

outputs:
  has-regression:
    description: 'true when at least one pass→fail regression was detected.'
    value: ${{ steps.diff.outputs.has-regression }}
  regressions:
    description: 'Number of pass→fail regressions.'
    value: ${{ steps.diff.outputs.regressions }}
  unmeasured:
    description: 'Number of evals the diff could not judge because a run errored (for example the provider did not answer). Not a regression; 0 when everything was measured.'
    value: ${{ steps.diff.outputs.unmeasured }}
  summary:
    description: 'One-line diff summary.'
    value: ${{ steps.diff.outputs.summary }}
  gate-exit-code:
    description: 'Exit code of plune diff with fail-on-regression or a gate input set: 0 passed, 1 a measured failure, 2 an input error, 3 not measured. Empty when none is set, or when the base ref has no baseline yet.'
    value: ${{ steps.diff.outputs.gate-exit-code }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '20'

    # Evals on the PR head (the current checkout). PLUNE_MOCK_PROVIDER=1 keeps the default run
    # free and deterministic; a real provider key is read from env/secrets by the CLI only when
    # use-mock is false.
    - id: run-current
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # Pass inputs as env, not interpolated into the script — avoids Actions expression injection.
        PLUNE_MOCK_PROVIDER: ${{ inputs.use-mock == 'true' && '1' || '' }}
        PLUNE_VERSION: ${{ inputs.plune-version }}
        PLUNE_CONFIG: ${{ inputs.config }}
      run: |
        # `plune run` exits non-zero when an eval *fails* — a normal result this action exists to
        # diff and report, not a hard error. Disambiguate by the output file: written = it ran (any
        # pass/fail) → continue; absent = it could not run (e.g. bad config) → fail with a clear error.
        npx -y "@plune-ai/cli@$PLUNE_VERSION" run -c "$PLUNE_CONFIG" --format json -o "$RUNNER_TEMP/plune-current.json" || true
        if [ ! -s "$RUNNER_TEMP/plune-current.json" ]; then
          echo "::error::plune run produced no output — check config '$PLUNE_CONFIG' and working-directory."
          exit 1
        fi
        # Human-readable run report for the job summary (reads the cached run; no extra model calls).
        # `-c` as on the run above: `plune report` looks for the run beside the config it is given,
        # and without the flag that is `plune.yaml` in the working directory — so a config anywhere
        # else (`evals/plune.yaml`) produced a summary that said "No run output" after a run that ran.
        npx -y "@plune-ai/cli@$PLUNE_VERSION" report -c "$PLUNE_CONFIG" --format markdown -o "$RUNNER_TEMP/plune-current.md" || true

    # Evals on the base ref, in a detached worktree so the PR checkout is untouched (ADR-GA02:
    # recompute baseline in the same job).
    - id: run-baseline
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLUNE_MOCK_PROVIDER: ${{ inputs.use-mock == 'true' && '1' || '' }}
        PLUNE_VERSION: ${{ inputs.plune-version }}
        PLUNE_CONFIG: ${{ inputs.config }}
        BASE_REF: ${{ inputs.base-ref }}
        # Passed as env (not interpolated) so the baseline run honors working-directory in a monorepo.
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        git fetch --no-tags --depth=1 origin "$BASE_REF"
        git worktree add --detach "$RUNNER_TEMP/plune-base" FETCH_HEAD
        # Mirror the PR-head run: cd into working-directory *inside* the base worktree, not its root.
        BASE_DIR="$RUNNER_TEMP/plune-base/$WORKING_DIRECTORY"
        if [ -f "$BASE_DIR/$PLUNE_CONFIG" ]; then
          # As with run-current: a failing eval (non-zero exit) is a result, not an error. Trust the
          # output file to tell ran-but-failed apart from could-not-run.
          ( cd "$BASE_DIR" && npx -y "@plune-ai/cli@$PLUNE_VERSION" run -c "$PLUNE_CONFIG" --format json -o "$RUNNER_TEMP/plune-baseline.json" ) || true
          if [ ! -s "$RUNNER_TEMP/plune-baseline.json" ]; then
            echo "::error::plune run produced no baseline output — check config '$PLUNE_CONFIG' on base ref ($BASE_REF)."
            exit 1
          fi
          echo "baseline=true" >> "$GITHUB_OUTPUT"
        else
          # First PR to introduce evals: config doesn't exist on the base ref yet. Degrade gracefully.
          echo "::notice::No Plune config at $PLUNE_CONFIG on base ref ($BASE_REF) — skipping baseline diff."
          echo "baseline=false" >> "$GITHUB_OUTPUT"
        fi

    # Pure diff (ADR-GA03): markdown for the comment body, json to drive the outputs + gate.
    # The gate inputs go to the CLI as flags, each only when set (scripts/diff-gates.mjs): a CLI older
    # than the gates exits 1 on a flag it does not know. With none set, the commands are as before.
    - id: diff
      shell: bash
      # So a relative `waivers` path reads like `config`; the run files are absolute paths.
      working-directory: ${{ inputs.working-directory }}
      env:
        PLUNE_VERSION: ${{ inputs.plune-version }}
        HAS_BASELINE: ${{ steps.run-baseline.outputs.baseline }}
        PLUNE_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        PLUNE_MAX_PASS_RATE_DROP_PERCENT: ${{ inputs.max-pass-rate-drop-percent }}
        PLUNE_MAX_COST_USD: ${{ inputs.max-cost-usd }}
        PLUNE_MAX_COST_INCREASE_PERCENT: ${{ inputs.max-cost-increase-percent }}
        PLUNE_MAX_TOKENS: ${{ inputs.max-tokens }}
        PLUNE_WAIVERS: ${{ inputs.waivers }}
      run: |
        # No baseline on the base ref (first eval PR): nothing to diff — emit a friendly note and clean
        # outputs instead of crashing on a missing plune-baseline.json (ENOENT). No gate either: green.
        if [ "$HAS_BASELINE" != "true" ]; then
          echo "_No Plune baseline on the base ref yet — nothing to diff. This is expected on the first PR that introduces evals._" > "$RUNNER_TEMP/plune-diff.md"
          printf 'has-regression=false\nregressions=0\nunmeasured=0\nsummary=no baseline yet\ngate-exit-code=\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Markdown for the comment, JSON for the outputs. Writes gate-exit-code, and fails here only when
        # the CLI wrote no JSON at all (an input error, a flag the pinned CLI does not know).
        node "$GITHUB_ACTION_PATH/scripts/diff-gates.mjs" diff
        node -e '
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/plune-diff.json", "utf8")).summary;
          // `unmeasured` exists from @plune-ai/cli 0.34.1; an older pin has no such field and reads as 0, so it behaves as before.
          const unmeasured = Number.isInteger(d.unmeasured) ? d.unmeasured : 0;
          const notMeasured = unmeasured > 0 ? `, ${unmeasured} not measured` : "";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has-regression=${d.hasRegression}\nregressions=${d.regressions}\nunmeasured=${unmeasured}\nsummary=${d.regressions} regression(s), ${d.improvements} improvement(s)${notMeasured}\n`);
        '

    # Sticky comment via the official toolkit only (GA04). The upsert helper is a tested .mjs in
    # this action; on a fork PR (read-only token) it skips quietly instead of failing.
    - if: ${{ inputs.comment == 'true' }}
      uses: actions/github-script@v9
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.RUNNER_TEMP + '/plune-diff.md', 'utf8');
          try {
            const { upsertStickyComment } = await import(process.env.ACTION_PATH + '/scripts/upsert-comment.mjs');
            const res = await upsertStickyComment(github, context, body);
            core.info('plune eval-diff comment: ' + res.action + (res.reason ? ' (' + res.reason + ')' : ''));
          } catch (err) {
            // Comment is best-effort (ADR-GA04): a GitHub API hiccup must not fail the check — the
            // diff and the regression gate still stand.
            core.warning('plune eval-diff: could not post comment — ' + (err && err.message ? err.message : err));
          }

    # Mirror the human-readable results to the Actions run page ($GITHUB_STEP_SUMMARY), not only the
    # PR comment — so re-runs, push/scheduled runs (no PR), and the first eval PR (no baseline) still
    # show pass/fail/cost. Best-effort and always() so results survive even when the gate fails below.
    - name: Job summary
      if: ${{ always() }}
      shell: bash
      env:
        HAS_BASELINE: ${{ steps.run-baseline.outputs.baseline }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        {
          if [ -s "$RUNNER_TEMP/plune-current.md" ]; then
            cat "$RUNNER_TEMP/plune-current.md"
          else
            echo "## Plune run"; echo; echo "_No run output was produced._"
          fi
          if [ "$HAS_BASELINE" = "true" ] && [ -s "$RUNNER_TEMP/plune-diff.md" ]; then
            echo; echo "## Diff vs \`$BASE_REF\`"; echo
            cat "$RUNNER_TEMP/plune-diff.md"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # Opt-in gate (AC-4): with fail-on-regression or a gate input set, a non-zero exit of the diff fails
    # the check (→ branch protection), with its own message for 1 (a measured failure), 2 (an input
    # error) and 3 (not measured: not a regression, and not a pass either). It runs after the comment,
    # so the «Gates» section is posted either way.
    - name: Gate
      if: ${{ steps.diff.outputs.gate-exit-code != '' && steps.diff.outputs.gate-exit-code != '0' }}
      shell: bash
      env:
        PLUNE_GATE_EXIT_CODE: ${{ steps.diff.outputs.gate-exit-code }}
      run: node "$GITHUB_ACTION_PATH/scripts/diff-gates.mjs" gate
